services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: anomaly
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: anomaly
    ports:
      - "5433:5432"
    volumes:
      - anomaly_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomaly -d anomaly"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - anomaly_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  anomaly_pg:
  anomaly_redis:


