[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loadguard-backend"
version = "0.1.0"
description = "Deterministic anomaly detection backend for bill debt load monitoring"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.110.0",
  "uvicorn==0.29.0",
  "pydantic==2.6.4",
  "pydantic-settings==2.2.1",
  "sqlalchemy==2.0.30",
  "alembic==1.13.1",
  "psycopg[binary]==3.1.18",
  "celery==5.4.0",
  "redis==5.0.4",
  "httpx==0.27.0",
  "jsonschema==4.22.0",
  "structlog==24.1.0",
  "python-dateutil==2.9.0.post0",
  "numpy==1.26.4",
  "scipy==1.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.0",
  "ruff==0.4.4",
  "mypy==1.10.0",
  "types-python-dateutil==2.9.0.20240316",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


