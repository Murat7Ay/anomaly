name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loadguard
          POSTGRES_PASSWORD: loadguard
          POSTGRES_DB: loadguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loadguard" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LOADGUARD_TEST_DATABASE_URL: postgresql+psycopg://loadguard:loadguard@127.0.0.1:5432/loadguard_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - name: Lockfile is in sync with pyproject
        run: |
          pip install uv
          cp requirements.lock /tmp/req.lock  # existing pins are preferences: only pyproject changes cause a diff
          uv pip compile pyproject.toml --python-version 3.12 --python-platform linux --generate-hashes -q -o /tmp/req.lock
          diff <(grep -E '^[a-z]' requirements.lock) <(grep -E '^[a-z]' /tmp/req.lock)
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: pytest -q
      - name: Migrations apply cleanly
        env:
          LG_DATABASE_URL: postgresql+psycopg://loadguard:loadguard@127.0.0.1:5432/loadguard
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack
        run: docker compose up -d --build --wait api web worker
      - name: Seed demo data
        run: docker compose run --rm api python -m loadguard.sim.seed --reset
      - name: Wait for a worker heartbeat
        run: |
          for i in $(seq 1 30); do docker compose run --rm api python -m loadguard.ops status >/dev/null && exit 0; sleep 5; done
          docker compose logs worker; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        working-directory: e2e
        run: npm install && npx playwright install --with-deps chromium && npx playwright test
      - name: Trust checks (audit chain, decision reproducibility)
        run: |
          docker compose run --rm api python -m loadguard.ops audit-verify
          docker compose run --rm api python -m loadguard.ops verify-sample --n 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
